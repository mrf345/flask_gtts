name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "2.7.18"
          - "3.5.9"
          - "3.6.10"
          - "3.7.7"
          - "3.8.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements/test.txt
      - run: flake8 && pytest
      - run: coveralls